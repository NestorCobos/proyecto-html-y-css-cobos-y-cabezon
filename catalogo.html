<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXTIME | Catálogo</title>
    <style>
        /* Variables para Modo Claro / Oscuro */
        :root {
            --bg-color: #0b0b0d;
            --card-bg: #141418;
            --text-color: #e1e1e6;
            --text-muted: #c4c4cc;
            --border-color: #2a2a30;
            --accent-gold: #d4af37;
            --accent-hover: #f0c442;
            --input-bg: #1a1a20;
            --nav-bg: rgba(15, 15, 18, 0.95);
        }

        body.light-mode {
            --bg-color: #f4f4f7;
            --card-bg: #ffffff;
            --text-color: #1a1a1e;
            --text-muted: #4a4a52;
            --border-color: #e1e1e6;
            --accent-gold: #b8860b;
            --accent-hover: #d4af37;
            --input-bg: #ffffff;
            --nav-bg: rgba(255, 255, 255, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        
        /* Navegación */
        nav { position: fixed; top: 0; width: 100%; background: var(--nav-bg); border-bottom: 1px solid rgba(212, 175, 55, 0.2); z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 18px 50px; }
        .logo { color: var(--accent-gold); font-size: 1.6rem; font-weight: 700; letter-spacing: 3px; text-decoration: none; }
        .nav-links { display: flex; list-style: none; gap: 20px; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-gold); }

        /* Botones del Nav (Modo Claro/Oscuro y Carrito) */
        .theme-toggle-btn, .cart-btn {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            position: relative;
        }
        .theme-toggle-btn:hover, .cart-btn:hover { background: var(--accent-gold); color: #0b0b0d; }
        .cart-count { background: var(--accent-gold); color: #0b0b0d; border-radius: 50%; padding: 2px 7px; font-size: 0.8rem; }
        .cart-btn:hover .cart-count { background: #0b0b0d; color: var(--accent-gold); }

        @keyframes cartBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .cart-btn.bounce {
            animation: cartBounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Estructura Principal */
        .container { max-width: 1300px; margin: 120px auto 50px; padding: 0 20px; }
        h1 { text-align: center; color: var(--accent-gold); font-size: 2.2rem; letter-spacing: 4px; margin-bottom: 30px; }

        /* Barra de Filtros */
        .filter-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
            align-items: center;
        }

        .filter-group { display: flex; flex-direction: column; gap: 5px; min-width: 200px; flex-grow: 1; }
        .filter-group label { color: var(--accent-gold); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        .filter-input, .filter-select {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
        }

        .filter-input:focus, .filter-select:focus { border-color: var(--accent-gold); }

        /* Grid de Productos */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.3s, border-color 0.3s;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(212, 175, 55, 0.3), transparent);
            transform: skewX(-25deg);
            transition: left 0.75s ease;
            pointer-events: none;
            z-index: 15;
        }
        .card:hover::before { left: 150%; }

        .card:hover { transform: translateY(-5px); border-color: var(--accent-gold); }
        .card img { width: 100%; height: 230px; object-fit: cover; background: var(--input-bg); }
        .card-body { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .card-marca { color: var(--accent-gold); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
        .card-modelo { font-size: 1.1rem; color: var(--text-color); margin: 5px 0; font-weight: 600; }
        .card-precio { font-size: 1.1rem; color: var(--accent-gold); font-weight: 700; margin-bottom: 15px; }

        .card-actions { display: flex; flex-direction: column; gap: 8px; }

        .btn-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
            padding: 10px;
            background: var(--accent-gold);
            color: #0b0b0d;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }

        .btn-card:hover { background: var(--accent-hover); }

        .btn-card-outline {
            background: transparent;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
        }

        .btn-card-outline:hover { background: var(--accent-gold); color: #0b0b0d; }

        /* Botón Flotante para Volver Arriba (Flecha) */
        .scroll-top-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: var(--accent-gold);
            color: #0b0b0d;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1500;
            transition: transform 0.3s;
        }

        .scroll-top-btn:hover { transform: translateY(-3px); }

        /* Panel Lateral del Carrito y Animaciones */
        .cart-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; display: none; }
        .cart-drawer { position: fixed; top: 0; right: -420px; width: 100%; max-width: 400px; height: 100%; background: var(--card-bg); border-left: 1px solid var(--border-color); z-index: 2001; transition: right 0.4s ease; display: flex; flex-direction: column; padding: 25px; }
        .cart-drawer.open { right: 0; }
        .cart-overlay.open { display: block; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .cart-header h2 { color: var(--accent-gold); font-size: 1.3rem; }
        .close-cart { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
        .cart-items { flex-grow: 1; overflow-y: auto; margin: 20px 0; display: flex; flex-direction: column; gap: 15px; }
        
        .cart-item { 
            display: flex; 
            gap: 15px; 
            background: var(--input-bg); 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            align-items: center; 
            transition: all 0.4s ease;
            max-height: 120px;
            overflow: hidden;
            position: relative;
        }

        @keyframes ejectAndDisappear {
            0% { transform: scale(1) translateY(0) rotate(0deg); opacity: 1; background: rgba(231, 76, 60, 0.2); }
            40% { transform: scale(1.05) translateY(-10px) rotate(-2deg); opacity: 0.8; }
            100% { transform: scale(0.3) translateY(-50px) translateX(40px) rotate(-45deg); opacity: 0; max-height: 0; margin: 0; padding: 0; border-color: transparent; }
        }

        .cart-item.falling-to-trash { animation: ejectAndDisappear 0.4s ease-in-out forwards; }

        .cart-item img { width: 55px; height: 55px; object-fit: contain; background: #fff; border-radius: 4px; padding: 2px; }
        .cart-item-details { flex-grow: 1; text-align: left; }
        .cart-item-title { font-size: 0.85rem; color: var(--text-color); font-weight: 600; margin-bottom: 4px; }
        .cart-item-price { font-size: 0.85rem; color: var(--accent-gold); font-weight: 700; margin-bottom: 6px; }
        
        .cart-item-controls { display: flex; align-items: center; gap: 8px; }
        .qty-btn { background: var(--border-color); color: var(--text-color); border: none; width: 22px; height: 22px; border-radius: 3px; cursor: pointer; font-weight: 700; }
        .qty-btn:hover { background: var(--accent-gold); color: #0b0b0d; }
        
        .btn-trash-delete {
            background: transparent;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
            margin-left: auto;
        }
        .btn-trash-delete:hover { background: rgba(231, 76, 60, 0.15); color: #ff6b6b; }

        @keyframes flyToCart {
            0% { opacity: 1; transform: translate(0, 0) scale(0.5) rotate(0deg); }
            50% { opacity: 1; transform: translate(var(--rand-x), -60px) scale(1.2) rotate(var(--rand-rot)); }
            100% { opacity: 0; transform: translate(var(--final-x), var(--final-y)) scale(0.3) rotate(0deg); }
        }

        .flying-money {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            font-size: 1.4rem;
            animation: flyToCart 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .cart-footer { border-top: 1px solid var(--border-color); padding-top: 15px; }
        .cart-total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; color: var(--text-color); margin-bottom: 20px; }
        .cart-total span:last-child { color: var(--accent-gold); }
        .btn-checkout { display: block; width: 100%; text-align: center; background: #25d366; color: #fff; padding: 12px; border-radius: 4px; text-decoration: none; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        footer { text-align: center; padding: 30px; border-top: 1px solid var(--border-color); color: var(--text-muted); margin-top: 50px; }
    </style>
</head>

            { id: 22, marca: "Patek Philippe", modelo: "Aquanaut 5167A", precio: 55000, precioTexto: "$55,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwZnI9O8JLRWIeOZKFYQ3Okq2Y-To0qTbeW6JFYaycUIOZ-oBP0yHhX_q4&s=10" }
        ];

        let cart = JSON.parse(localStorage.getItem('luxtime_cart')) || [];

        // --- SISTEMA MODO CLARO / OSCURO ---
        function applyTheme(theme) {
            const themeBtn = document.getElementById('themeToggleBtn');
            if (theme === 'light') {
                document.body.classList.add('light-mode');
                themeBtn.innerHTML = '☀️ Claro';
            } else {
                document.body.classList.remove('light-mode');
                themeBtn.innerHTML = '🌙 Oscuro';
            }
        }

        function toggleTheme() {
            const currentTheme = document.body.classList.contains('light-mode') ? 'dark' : 'light';
            localStorage.setItem('luxtime_theme', currentTheme);
            applyTheme(currentTheme);
        }

        const savedTheme = localStorage.getItem('luxtime_theme') || 'dark';
        applyTheme(savedTheme);

        // --- FLECHA VOLVER ARRIBA ---
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- EFECTO DE BILLETES VOLANDO AL CARRITO ---
        function triggerMoneyEffect(event) {
            const btn = event.target.closest('button');
            if (!btn) return;
            const rect = btn.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top + rect.height / 2;

            const cartBtn = document.getElementById('cartNavBtn');
            const cartRect = cartBtn.getBoundingClientRect();
            const targetX = cartRect.left + cartRect.width / 2;
            const targetY = cartRect.top + cartRect.height / 2;

            cartBtn.classList.add('bounce');
            setTimeout(() => cartBtn.classList.remove('bounce'), 300);

            for (let i = 0; i < 5; i++) {
                const money = document.createElement('div');
                money.className = 'flying-money';
                money.textContent = '💵';
                
                money.style.left = `${startX}px`;
                money.style.top = `${startY}px`;

                const randX = (Math.random() - 0.5) * 60 + 'px';
                const randRot = (Math.random() - 0.5) * 60 + 'deg';
                const finalX = (targetX - startX) + (Math.random() - 0.5) * 30;
                const finalY = (targetY - startY) + (Math.random() - 0.5) * 30;

                money.style.setProperty('--rand-x', randX);
                money.style.setProperty('--rand-rot', randRot);
                money.style.setProperty('--final-x', `${finalX}px`);
                money.style.setProperty('--final-y', `${finalY}px`);

                document.body.appendChild(money);
                setTimeout(() => money.remove(), 800);
            }
        }

        // --- CARGAR PRODUCTOS Y FILTROS ---
        const grid = document.getElementById('catalogGrid');
        const searchInput = document.getElementById('searchInput');
        const brandSelect = document.getElementById('brandSelect');
        const sortSelect = document.getElementById('sortSelect');

        function renderProductos(lista) {
            grid.innerHTML = '';

            if (lista.length === 0) {
                grid.innerHTML = '<div class="no-results">No se encontraron productos con los criterios seleccionados.</div>';
                return;
            }

            lista.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${p.imagen}" alt="${p.marca} ${p.modelo}">
                    <div class="card-body">
                        <div>
                            <span class="card-marca">${p.marca}</span>
                            <h3 class="card-modelo">${p.modelo}</h3>
                            <div class="card-precio">${p.precioTexto}</div>
                        </div>
                        <div class="card-actions">
                            <button class="btn-card" onclick="addToCart(${p.id}, event)">🛒 Añadir al Carrito</button>
                            <a href="producto.html?id=${p.id}" class="btn-card btn-card-outline">Ver Detalle &rarr;</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function aplicarFiltros() {
            let resultado = [...productos];
            const textoBusqueda = searchInput.value.toLowerCase().trim();
            const marcaSeleccionada = brandSelect.value;
            const ordenPrecio = sortSelect.value;

            if (textoBusqueda !== '') {
                resultado = resultado.filter(p => 
                    p.marca.toLowerCase().includes(textoBusqueda) || 
                    p.modelo.toLowerCase().includes(textoBusqueda)
                );
            }

            if (marcaSeleccionada !== 'todos') {
                resultado = resultado.filter(p => p.marca === marcaSeleccionada);
            }

            if (ordenPrecio === 'asc') {
                resultado.sort((a, b) => a.precio - b.precio);
            } else if (ordenPrecio === 'desc') {
                resultado.sort((a, b) => b.precio - a.precio);
            }

            renderProductos(resultado);
        }

        // --- FUNCIONALIDADES DEL CARRITO ---
        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('open');
            document.getElementById('cartOverlay').classList.toggle('open');
        }

        function addToCart(id, event) {
            triggerMoneyEffect(event);

            const product = productos.find(p => p.id === id);
            const itemInCart = cart.find(i => i.id === id);

            if (itemInCart) {
                itemInCart.cantidad++;
            } else {
                cart.push({ ...product, cantidad: 1 });
            }

            saveAndUpdateCart();
            setTimeout(() => toggleCart(), 300);
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.cantidad += delta;
                if (item.cantidad <= 0) {
                    removeFromCartAnim(id);
                    return;
                }
            }
            saveAndUpdateCart();
        }

        function removeFromCartAnim(id) {
            const itemElements = document.querySelectorAll('.cart-item');
            cart.forEach((item, index) => {
                if (item.id === id && itemElements[index]) {
                    itemElements[index].classList.add('falling-to-trash');
                }
            });

            setTimeout(() => {
                cart = cart.filter(i => i.id !== id);
                saveAndUpdateCart();
            }, 400);
        }

        function saveAndUpdateCart() {
            localStorage.setItem('luxtime_cart', JSON.stringify(cart));
            renderCart();
        }

        function renderCart() {
            const cartItemsContainer = document.getElementById('cartItems');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');
            const checkoutBtn = document.getElementById('checkoutBtn');

            cartItemsContainer.innerHTML = '';
            let total = 0;
            let totalCount = 0;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 30px;">Tu carrito está vacío.</p>';
            } else {
                cart.forEach(item => {
                    total += item.precio * item.cantidad;
                    totalCount += item.cantidad;

                    const itemElement = document.createElement('div');
                    itemElement.className = 'cart-item';
                    itemElement.innerHTML = `
                        <img src="${item.imagen}" alt="${item.modelo}">
                        <div class="cart-item-details">
                            <div class="cart-item-title">${item.marca} ${item.modelo}</div>
                            <div class="cart-item-price">$${(item.precio * item.cantidad).toLocaleString()} USD</div>
                            <div class="cart-item-controls">
                                <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                                <span>${item.cantidad}</span>
                                <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                                <button class="btn-trash-delete" onclick="removeFromCartAnim(${item.id})">
                                    🗑️ Eliminar
                                </button>
                            </div>
                        </div>
                    `;
                    cartItemsContainer.appendChild(itemElement);
                });
            }

            cartCount.textContent = totalCount;
            cartTotal.textContent = `$${total.toLocaleString()} USD`;

            if (cart.length > 0) {
                let mensaje = "Hola LUXTIME, deseo realizar el pedido de los siguientes relojes:%0A%0A";
                cart.forEach(item => {
                    mensaje += `• ${item.marca} ${item.modelo} x${item.cantidad} - $${(item.precio * item.cantidad).toLocaleString()} USD%0A`;
                });
                mensaje += `%0ATotal: $${total.toLocaleString()} USD`;
                checkoutBtn.href = `https://wa.me/573209954324?text=${mensaje}`;
            } else {
                checkoutBtn.href = "#";
            }
        }

        // Listeners de los filtros
        searchInput.addEventListener('input', aplicarFiltros);
        brandSelect.addEventListener('change', aplicarFiltros);
        sortSelect.addEventListener('change', aplicarFiltros);

        // Inicialización
        renderProductos(productos);
        renderCart();
    </script>
</body>
</html>
