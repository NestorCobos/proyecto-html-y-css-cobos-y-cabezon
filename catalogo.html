<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXTIME | Catálogo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0b0d; color: #e1e1e6; line-height: 1.6; }
        
        /* Navegación */
        nav { position: fixed; top: 0; width: 100%; background: rgba(15, 15, 18, 0.95); border-bottom: 1px solid rgba(212, 175, 55, 0.2); z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 18px 50px; }
        .logo { color: #d4af37; font-size: 1.6rem; font-weight: 700; letter-spacing: 3px; text-decoration: none; }
        .nav-links { display: flex; list-style: none; gap: 30px; }
        .nav-links a { color: #c4c4cc; text-decoration: none; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #d4af37; }

        /* Estructura Principal */
        .container { max-width: 1300px; margin: 120px auto 50px; padding: 0 20px; }
        h1 { text-align: center; color: #d4af37; font-size: 2.2rem; letter-spacing: 4px; margin-bottom: 30px; }

        /* Barra de Filtros */
        .filter-bar {
            background: #141418;
            border: 1px solid #2a2a30;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
            align-items: center;
        }

        .filter-group { display: flex; flex-direction: column; gap: 5px; min-width: 200px; flex-grow: 1; }
        .filter-group label { color: #d4af37; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        .filter-input, .filter-select {
            background: #1a1a20;
            border: 1px solid #2a2a30;
            color: #fff;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .filter-input:focus, .filter-select:focus { border-color: #d4af37; }

        /* Grid de Productos */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .card {
            background: #141418;
            border: 1px solid #2a2a30;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
        }

        .card:hover { transform: translateY(-5px); border-color: #d4af37; }

        .card img { width: 100%; height: 230px; object-fit: cover; background: #1a1a20; }

        .card-body { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .card-marca { color: #d4af37; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
        .card-modelo { font-size: 1.1rem; color: #fff; margin: 5px 0; font-weight: 600; }
        .card-precio { font-size: 1.1rem; color: #d4af37; font-weight: 700; margin-bottom: 15px; }

        .btn-card {
            display: block;
            text-align: center;
            padding: 10px;
            background: #d4af37;
            color: #0b0b0d;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            border-radius: 4px;
            transition: background 0.3s;
        }

        .btn-card:hover { background: #f0c442; }

        .no-results { grid-column: 1 / -1; text-align: center; color: #a8a8b3; padding: 50px 0; font-size: 1.1rem; }

        footer { text-align: center; padding: 30px; border-top: 1px solid #23232a; color: #737380; margin-top: 50px; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">LUXTIME</a>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="historia.html">Nuestra Historia</a></li>
            <li><a href="catalogo.html" class="active">Catálogo</a></li>
            <li><a href="contacto.html">Contáctenos</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>NUESTRA COLECCIÓN</h1>

        <!-- Controles de Filtros -->
        <div class="filter-bar">
            <!-- Buscar por Nombre o Modelo -->
            <div class="filter-group">
                <label for="searchInput">Buscar</label>
                <input type="text" id="searchInput" class="filter-input" placeholder="Ej: Daytona, Pepsi...">
            </div>

            <!-- Filtrar por Marca -->
            <div class="filter-group">
                <label for="brandSelect">Marca</label>
                <select id="brandSelect" class="filter-select">
                    <option value="todos">Todas las marcas</option>
                    <option value="Rolex">Rolex</option>
                    <option value="Patek Philippe">Patek Philippe</option>
                    <option value="Audemars Piguet">Audemars Piguet</option>
                    <option value="Vacheron Constantin">Vacheron Constantin</option>
                    <option value="A. Lange & Söhne">A. Lange & Söhne</option>
                    <option value="Omega">Omega</option>
                    <option value="Cartier">Cartier</option>
                    <option value="Jaeger-LeCoultre">Jaeger-LeCoultre</option>
                    <option value="Richard Mille">Richard Mille</option>
                    <option value="TAG Heuer">TAG Heuer</option>
                    <option value="Olevs">Olevs</option>
                </select>
            </div>

            <!-- Ordenar por Precio -->
            <div class="filter-group">
                <label for="sortSelect">Ordenar por Precio</label>
                <select id="sortSelect" class="filter-select">
                    <option value="default">Por defecto</option>
                    <option value="asc">De menor a mayor precio</option>
                    <option value="desc">De mayor a menor precio</option>
                </select>
            </div>
        </div>

        <!-- Grid donde se cargan los productos -->
        <div class="catalog-grid" id="catalogGrid"></div>
    </div>

    <footer>
        <p>&copy; 2026 LUXTIME. San Gil, Santander.</p>
    </footer>

    <script>
        const productos = [
            { id: 1, marca: "Rolex", modelo: "Submariner Date", precio: 14500, precioTexto: "$14,500 USD", imagen: "https://media.rolex.com/image/upload/q_auto/f_auto/t_v7-cover-majesty-landscape/c_limit,w_800/v1/a677b2c664f6/catalogue/2026/upright-c/m126610ln-0001" },
            { id: 2, marca: "Rolex", modelo: "Cosmograph Daytona", precio: 38000, precioTexto: "$38,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlMAYEo_kmq0SEVRRTfxLseV2wnsMXngC2wunQaGWdsA&s=10" },
            { id: 3, marca: "Rolex", modelo: "Datejust 41", precio: 12800, precioTexto: "$12,800 USD", imagen: "https://encrypted-tbn1.gstatic.com/shopping?q=tbn:ANd9GcTCPIgqQ33orNUNhxU0779oylJW_-m0yjFpjWaGA-b_bzN0TGecWLGU8Okqk5lRgcdJKpuhqx5KMnpC9GricJ_KrD7a5emn" },
            { id: 4, marca: "Patek Philippe", modelo: "Nautilus 5711/1A", precio: 115000, precioTexto: "$115,000 USD", imagen: "https://www.officialwatches.com/cdn/shop/products/502410_600x.jpg?v=1610711759" },
            { id: 5, marca: "Patek Philippe", modelo: "Calatrava Automatic", precio: 29500, precioTexto: "$29,500 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTM6yhdJw0yoWIQaHOMv5jZjZLXv9AW1ZJd6AOJXYUJHaDeSEHnXEEJecQ&s=10" },
            { id: 6, marca: "Audemars Piguet", modelo: "Royal Oak", precio: 62000, precioTexto: "$62,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSIbNA3xzhtwSOrqsB6eXBQMebC6EbjvqxL0OhHR9MaDw&s=10" },
            { id: 7, marca: "Audemars Piguet", modelo: "Royal Oak Offshore", precio: 45000, precioTexto: "$45,000 USD", imagen: "https://i.ebayimg.com/images/g/Dp0AAeSwsehqYDNt/s-l1200.webp" },
            { id: 8, marca: "Vacheron Constantin", modelo: "Overseas", precio: 36000, precioTexto: "$36,000 USD", imagen: "https://cdn-images.farfetch-contents.com/31/12/19/48/31121948_60422243_1000.jpg" },
            { id: 9, marca: "Vacheron Constantin", modelo: "Historiques 1921", precio: 41000, precioTexto: "$41,000 USD", imagen: "https://img.chrono24.com/images/uhren/47100979-38kqklhc941m99mkiw03hrqz-ExtraLarge.jpg" },
            { id: 10, marca: "A. Lange & Söhne", modelo: "Lange 1", precio: 52000, precioTexto: "$52,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhvWf_a4No4qk3iywiuXMyzdcMsnuKMDWVNgqTqfLehUgP0j2gSBal-YgT&s=10" },
            { id: 11, marca: "A. Lange & Söhne", modelo: "Datograph", precio: 98000, precioTexto: "$98,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROIFmu-N6HwGLGfAp0Rw2D1iuv9HBvSgcohynK9OxTl_NWpno_EF-ki88&s=10" },
            { id: 12, marca: "Omega", modelo: "Speedmaster Pro", precio: 7600, precioTexto: "$7,600 USD", imagen: "https://plazavendome.vteximg.com.br/arquivos/ids/167367-1000-1000/Group-29.jpg?v=638725580614030000" },
            { id: 13, marca: "Omega", modelo: "Seamaster Diver 300M", precio: 5900, precioTexto: "$5,900 USD", imagen: "https://plazavendome.vteximg.com.br/arquivos/ids/161251-1000-1000/omega-reloj-seamaster-diver-300m-co-axial-master-chronometer-chronograph-44mm-21030445106001-1.jpg?v=637614546101600000" },
            { id: 14, marca: "Cartier", modelo: "Santos de Cartier", precio: 8200, precioTexto: "$8,200 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTgIp273fN9sle3JaABB3Rnx10OfORxlgIcztHqf8YXAw4h8XIHCYHXO4E&s=10" },
            { id: 15, marca: "Cartier", modelo: "Tank Louis", precio: 13400, precioTexto: "$13,400 USD", imagen: "https://cdn-images.farfetch-contents.com/31/12/21/12/31122112_60347391_600.jpg" },
            { id: 16, marca: "Jaeger-LeCoultre", modelo: "Reverso Tribute", precio: 10800, precioTexto: "$10,800 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7UclMjOUOe9VvAOtseuy0GYuuIWYW6bAYwFmlJZ2wGA&s=10" },
            { id: 17, marca: "Richard Mille", modelo: "RM 11-03", precio: 270000, precioTexto: "$270,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQO_BtwS0xqsJzUoWDXrr4ZGDnTW7mauu3IywFRYqTiZATZOWdWC5fFWmOz&s=10" },
            { id: 18, marca: "TAG Heuer", modelo: "Monaco Calibre 11", precio: 7800, precioTexto: "$7,800 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-BDrzAwddHZeMpRC4vVAoJ1xxEhqncC4OxkqK7BpJmpB4lOBU6P8gCbiC&s=10" },
            { id: 19, marca: "Rolex", modelo: "GMT-Master II Pepsi", precio: 21500, precioTexto: "$21,500 USD", imagen: "https://galileo.tsqsa.com/FTPImagenes/rolex-img/watches-models/m126710blro-0002-drp-upright-bba-with-shadow-landscape.webp" },
            { id: 20, marca: "Rolex", modelo: "Day-Date 40 Oro", precio: 42000, precioTexto: "$42,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRdb8VEnGLpSkCAC5JwwLh6-y_KG0fwBXOs3vpJCzKOUSsA7ZUZFIVyvjHv&s=10" },
            { id: 21, marca: "Olevs", modelo: "el que tiene el profesor", precio: 1000000, precioTexto: "$1,000,000 USD", imagen: "https://http2.mlstatic.com/D_NQ_NP_957121-CBT76357393642_052024-O.webp" },
            { id: 22, marca: "Patek Philippe", modelo: "Aquanaut 5167A", precio: 55000, precioTexto: "$55,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwZnI9O8JLRWIeOZKFYQ3Okq2Y-To0qTbeW6JFYaycUIOZ-oBP0yHhX_q4&s=10" }
        ];

        const grid = document.getElementById('catalogGrid');
        const searchInput = document.getElementById('searchInput');
        const brandSelect = document.getElementById('brandSelect');
        const sortSelect = document.getElementById('sortSelect');

        function renderProductos(lista) {
            grid.innerHTML = '';

            if (lista.length === 0) {
                grid.innerHTML = '<div class="no-results">No se encontraron productos con los criterios seleccionados.</div>';
                return;
            }

            lista.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${p.imagen}" alt="${p.marca} ${p.modelo}">
                    <div class="card-body">
                        <div>
                            <span class="card-marca">${p.marca}</span>
                            <h3 class="card-modelo">${p.modelo}</h3>
                            <div class="card-precio">${p.precioTexto}</div>
                        </div>
                        <a href="producto.html?id=${p.id}" class="btn-card">Ver Producto</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function aplicarFiltros() {
            let resultado = [...productos];
            const textoBusqueda = searchInput.value.toLowerCase().trim();
            const marcaSeleccionada = brandSelect.value;
            const ordenPrecio = sortSelect.value;

            // 1. Filtrar por búsqueda
            if (textoBusqueda !== '') {
                resultado = resultado.filter(p => 
                    p.marca.toLowerCase().includes(textoBusqueda) || 
                    p.modelo.toLowerCase().includes(textoBusqueda)
                );
            }

            // 2. Filtrar por marca
            if (marcaSeleccionada !== 'todos') {
                resultado = resultado.filter(p => p.marca === marcaSeleccionada);
            }

            // 3. Ordenar por precio
            if (ordenPrecio === 'asc') {
                resultado.sort((a, b) => a.precio - b.precio);
            } else if (ordenPrecio === 'desc') {
                resultado.sort((a, b) => b.precio - a.precio);
            }

            renderProductos(resultado);
        }

        // Escuchar cambios en los filtros
        searchInput.addEventListener('input', aplicarFiltros);
        brandSelect.addEventListener('change', aplicarFiltros);
        sortSelect.addEventListener('change', aplicarFiltros);

        // Renderizado inicial
        renderProductos(productos);
    </script>
</body>
</html>
