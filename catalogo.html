<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXTIME | Catálogo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0b0d; color: #e1e1e6; line-height: 1.6; }
        nav { position: fixed; top: 0; width: 100%; background: rgba(15, 15, 18, 0.95); border-bottom: 1px solid rgba(212, 175, 55, 0.2); z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 18px 50px; }
        .logo { color: #d4af37; font-size: 1.6rem; font-weight: 700; letter-spacing: 3px; text-decoration: none; }
        .nav-links { display: flex; list-style: none; gap: 30px; }
        .nav-links a { color: #c4c4cc; text-decoration: none; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px; }
        .nav-links a:hover, .nav-links a.active { color: #d4af37; }

        section { padding: 120px 20px 60px; max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; font-size: 2.5rem; color: #d4af37; letter-spacing: 4px; margin-bottom: 40px; text-transform: uppercase; }

        .grid-relojes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; }
        .card { background: #141418; border: 1px solid #23232a; border-radius: 6px; overflow: hidden; transition: all 0.3s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-7px); border-color: #d4af37; }
        .card img { width: 100%; height: 260px; object-fit: cover; background-color: #1a1a20; }
        .card-body { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .marca { color: #d4af37; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
        .modelo { font-size: 1.1rem; font-weight: 600; margin: 5px 0; color: #fff; }
        .precio { font-size: 1.2rem; font-weight: 700; color: #e1e1e6; margin-bottom: 15px; }
        .btn-detalles { margin-top: auto; background: transparent; color: #d4af37; border: 1px solid #d4af37; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: 600; text-align: center; text-decoration: none; transition: all 0.3s ease; }
        .btn-detalles:hover { background-color: #d4af37; color: #0b0b0d; }

        footer { text-align: center; padding: 30px; border-top: 1px solid #23232a; color: #737380; margin-top: 50px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">LUXTIME</a>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="historia.html">Nuestra Historia</a></li>
            <li><a href="catalogo.html" class="active">Catálogo</a></li>
            <li><a href="contacto.html">Contáctenos</a></li>
        </ul>
    </nav>

    <section>

        <div class="grid-relojes" id="gridRelojes"></div>

    <footer>
        <p>&copy; 2026 LUXTIME. San Gil, Santander.</p>
    </footer>

        ];  

        const grid = document.getElementById('gridRelojes');
        relojes.forEach(r => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${r.imagen}" alt="${r.marca} ${r.modelo}">
                <div class="card-body">
                    <span class="marca">${r.marca}</span>
                    <h3 class="modelo">${r.modelo}</h3>
                    <div class="precio">${r.precio}</div>
                    <button class="btn-detalles" onclick="verProducto(${r.id})">Ver Detalles</button>
                </div>
            `;
            grid.appendChild(card);
        });

        // Redirección a la página de producto individual pasando el ID
        function verProducto(id) {
            window.location.href = `producto.html?id=${id}`;
        }
    </script>
</body>
</html>
