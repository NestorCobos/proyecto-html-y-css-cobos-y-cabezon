<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXTIME | Alta Relojería</title>
    <style>
        :root {
            --bg-color: #0b0b0d;
            --card-bg: #141418;
            --text-color: #e1e1e6;
            --text-muted: #8d8d99;
            --border-color: #2a2a30;
            --accent-gold: #d4af37;
            --accent-hover: #f0c442;
            --nav-bg: rgba(15, 15, 18, 0.95);
            --input-bg: #1a1a20;
        }

        body.light-mode {
            --bg-color: #f4f4f7;
            --card-bg: #ffffff;
            --text-color: #1a1a1e;
            --text-muted: #5a5a66;
            --border-color: #e1e1e6;
            --accent-gold: #b8860b;
            --accent-hover: #d4af37;
            --nav-bg: rgba(255, 255, 255, 0.95);
            --input-bg: #ffffff;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', sans-serif; 
            transition: background-color 0.3s, color 0.3s; 
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            overflow-x: hidden; 
        }

        /* Navegación */
        nav { 
            position: fixed; 
            top: 0; 
            width: 100%; 
            background: var(--nav-bg); 
            border-bottom: 1px solid rgba(212, 175, 55, 0.2); 
            z-index: 1000; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 18px 50px; 
        }
        .logo { color: var(--accent-gold); font-size: 1.6rem; font-weight: 700; letter-spacing: 3px; text-decoration: none; }
        .nav-links { display: flex; list-style: none; gap: 20px; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-gold); }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-toggle-btn, .cart-btn {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            position: relative;
        }
        .theme-toggle-btn:hover, .cart-btn:hover { background: var(--accent-gold); color: #0b0b0d; }
        .cart-count { background: var(--accent-gold); color: #0b0b0d; border-radius: 50%; padding: 2px 7px; font-size: 0.8rem; }
        .cart-btn:hover .cart-count { background: #0b0b0d; color: var(--accent-gold); }

        @keyframes cartBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .cart-btn.bounce {
            animation: cartBounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Encabezado */
        .hero-header { margin-top: 110px; text-align: center; padding: 0 20px; }
        .hero-header h1 { font-size: 2.8rem; color: var(--accent-gold); letter-spacing: 5px; font-weight: 700; margin-bottom: 8px; }
        .hero-header p { color: var(--text-muted); font-size: 1.1rem; letter-spacing: 1px; }

        /* CARRUSEL 3D */
        .carousel-wrapper {
            position: relative;
            width: 90%;
            max-width: 1050px;
            margin: 40px auto;
            height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .card {
            position: absolute;
            width: 290px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            user-select: none;
            opacity: 0;
            transform: scale(0.7) translateZ(-200px);
            pointer-events: none;
            overflow: hidden;
            transition: transform 0.5s ease, opacity 0.5s ease, filter 0.5s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(212, 175, 55, 0.3), transparent);
            transform: skewX(-25deg);
            transition: left 0.75s ease;
            pointer-events: none;
            z-index: 15;
        }
        .card.active:hover::before { left: 150%; }

        @keyframes floatCard {
            0%, 100% { transform: scale(1.05) translateY(0); }
            50% { transform: scale(1.05) translateY(-8px); }
        }

        .card.active {
            opacity: 1;
            z-index: 10;
            border-color: var(--accent-gold);
            pointer-events: auto;
            animation: floatCard 3s ease-in-out infinite;
        }

        .card.prev-card {
            opacity: 0.35;
            transform: translateX(-260px) scale(0.82);
            z-index: 5;
            pointer-events: auto;
            filter: brightness(0.7);
        }

        .card.next-card {
            opacity: 0.35;
            transform: translateX(260px) scale(0.82);
            z-index: 5;
            pointer-events: auto;
            filter: brightness(0.7);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: contain;
            margin-bottom: 15px;
            background: #fff;
            border-radius: 6px;
            padding: 5px;
        }

        .card-brand { font-size: 0.75rem; color: var(--accent-gold); text-transform: uppercase; font-weight: 700; letter-spacing: 1.5px; }
        .card-title { font-size: 1.1rem; color: var(--text-color); font-weight: 700; margin: 4px 0 8px 0; }
        .card-price { font-size: 1.1rem; color: var(--accent-gold); font-weight: 700; margin-bottom: 18px; }

        .card-buttons { display: flex; gap: 10px; }
        .btn-ver, .btn-add {
            flex: 1;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.3s, border-color 0.3s;
        }
        .btn-ver { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); }
        .btn-ver:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
        .btn-add { background: var(--accent-gold); border: 1px solid var(--accent-gold); color: #0b0b0d; }
        .btn-add:hover { background: var(--accent-hover); }

        /* Flechas */
        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(20, 20, 24, 0.85);
            color: var(--accent-gold);
            border: 2px solid var(--accent-gold);
            font-size: 1.5rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s, color 0.2s;
        }
        .carousel-arrow:hover { background: var(--accent-gold); color: #0b0b0d; transform: translateY(-50%) scale(1.1); }
        .carousel-arrow.prev { left: -30px; }
        .carousel-arrow.next { right: -30px; }

        /* Drawer del Carrito */
        .cart-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; display: none; }
        .cart-drawer { position: fixed; top: 0; right: -420px; width: 100%; max-width: 400px; height: 100%; background: var(--card-bg); border-left: 1px solid var(--border-color); z-index: 2001; transition: right 0.4s ease; display: flex; flex-direction: column; padding: 25px; }
        .cart-drawer.open { right: 0; }
        .cart-overlay.open { display: block; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .cart-header h2 { color: var(--accent-gold); font-size: 1.3rem; }
        .close-cart { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
        .cart-items { flex-grow: 1; overflow-y: auto; margin: 20px 0; display: flex; flex-direction: column; gap: 15px; }
        
        .cart-item { 
            display: flex; 
            gap: 15px; 
            background: var(--input-bg); 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            align-items: center; 
            transition: all 0.4s ease;
            max-height: 120px;
            overflow: hidden;
            position: relative;
        }

        @keyframes ejectAndDisappear {
            0% { transform: scale(1) translateY(0) rotate(0deg); opacity: 1; background: rgba(231, 76, 60, 0.2); }
            40% { transform: scale(1.05) translateY(-10px) rotate(-2deg); opacity: 0.8; }
            100% { transform: scale(0.3) translateY(-50px) translateX(40px) rotate(-45deg); opacity: 0; max-height: 0; margin: 0; padding: 0; border-color: transparent; }
        }

        .cart-item.falling-to-trash { animation: ejectAndDisappear 0.4s ease-in-out forwards; }

        .cart-item img { width: 55px; height: 55px; object-fit: contain; background: #fff; border-radius: 4px; padding: 2px; }
        .cart-item-details { flex-grow: 1; }
        .cart-item-title { font-size: 0.85rem; color: var(--text-color); font-weight: 600; margin-bottom: 4px; }
        .cart-item-price { font-size: 0.85rem; color: var(--accent-gold); font-weight: 700; margin-bottom: 6px; }
        
        .cart-item-controls { display: flex; align-items: center; gap: 8px; }
        .qty-btn { background: var(--border-color); color: var(--text-color); border: none; width: 22px; height: 22px; border-radius: 3px; cursor: pointer; font-weight: 700; }
        .qty-btn:hover { background: var(--accent-gold); color: #0b0b0d; }
        
        .btn-trash-delete {
            background: transparent;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
            margin-left: auto;
        }
        .btn-trash-delete:hover { background: rgba(231, 76, 60, 0.15); color: #ff6b6b; }

        @keyframes flyToCart {
            0% { opacity: 1; transform: translate(0, 0) scale(0.5) rotate(0deg); }
            50% { opacity: 1; transform: translate(var(--rand-x), -60px) scale(1.2) rotate(var(--rand-rot)); }
            100% { opacity: 0; transform: translate(var(--final-x), var(--final-y)) scale(0.3) rotate(0deg); }
        }

        .flying-money {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            font-size: 1.4rem;
            animation: flyToCart 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .cart-footer { border-top: 1px solid var(--border-color); padding-top: 15px; }
        .cart-total { display: flex; justify-content: space-between; font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; }
        .btn-checkout { display: block; width: 100%; text-align: center; background: #25d366; color: #fff; padding: 12px; border-radius: 4px; text-decoration: none; font-weight: 700; text-transform: uppercase; }

        footer { text-align: center; padding: 25px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- NAVEGACIÓN -->
    <nav>
        <a href="./" class="logo">LUXTIME</a>
        <ul class="nav-links">
            <li><a href="./" class="active">Inicio</a></li>

        </ul>
        <div class="nav-buttons">
            <button class="cart-btn" id="cartNavBtn" onclick="openCart()">
                🛒 Carrito <span class="cart-count" id="cartCount">0</span>
            </button>
            <button class="theme-toggle-btn" onclick="toggleTheme()">
                <span id="themeIcon">🌙 Modo Oscuro</span>
            </button>
        </div>
    </nav>

    <!-- ENCABEZADO -->
    <header class="hero-header">
        <h1>COLECCIÓN EXCLUSIVA</h1>
        <p>Piezas únicas de la más alta precisión micro-mecánica</p>
    </header>

    <!-- CARRUSEL 3D -->
    <div class="carousel-wrapper">
        <button class="carousel-arrow prev" onclick="prevSlide()">&#10094;</button>
        <div class="carousel-container" id="carouselContainer"></div>
        <button class="carousel-arrow next" onclick="nextSlide()">&#10095;</button>
    </div>

    <!-- DRAWER DEL CARRITO -->
    <div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h2>Tu Carrito de Compras</h2>
            <button class="close-cart" onclick="closeCart()">&times;</button>
        </div>
        <div class="cart-items" id="cartItemsContainer"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total Estimado:</span>
                <span id="cartTotal" style="color:var(--accent-gold);">$0 USD</span>
            </div>
            <a href="#" id="whatsappCheckoutBtn" target="_blank" class="btn-checkout">Pedir por WhatsApp</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 LUXTIME. San Gil, Santander. Fundado por Manuel y Cobos.</p>
    </footer>

    <script>
        const productos = [
            { id: 1, marca: "Rolex", modelo: "Submariner Date", precio: 14500, precioTexto: "$14,500 USD", imagen: "https://media.rolex.com/image/upload/q_auto/f_auto/t_v7-cover-majesty-landscape/c_limit,w_800/v1/a677b2c664f6/catalogue/2026/upright-c/m126610ln-0001" },

            { id: 4, marca: "Patek Philippe", modelo: "Nautilus 5711/1A", precio: 115000, precioTexto: "$115,000 USD", imagen: "https://www.officialwatches.com/cdn/shop/products/502410_600x.jpg?v=1610711759" },
            { id: 5, marca: "Patek Philippe", modelo: "Calatrava Automatic", precio: 29500, precioTexto: "$29,500 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTM6yhdJw0yoWIQaHOMv5jZjZLXv9AW1ZJd6AOJXYUJHaDeSEHnXEEJecQ&s=10" },
            { id: 6, marca: "Audemars Piguet", modelo: "Royal Oak", precio: 62000, precioTexto: "$62,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSIbNA3xzhtwSOrqsB6eXBQMebC6EbjvqxL0OhHR9MaDw&s=10" },
            { id: 7, marca: "Audemars Piguet", modelo: "Royal Oak Offshore", precio: 45000, precioTexto: "$45,000 USD", imagen: "https://i.ebayimg.com/images/g/Dp0AAeSwsehqYDNt/s-l1200.webp" },
            { id: 8, marca: "Vacheron Constantin", modelo: "Overseas", precio: 36000, precioTexto: "$36,000 USD", imagen: "https://cdn-images.farfetch-contents.com/31/12/19/48/31121948_60422243_1000.jpg" },
            { id: 9, marca: "Vacheron Constantin", modelo: "Historiques 1921", precio: 41000, precioTexto: "$41,000 USD", imagen: "https://img.chrono24.com/images/uhren/47100979-38kqklhc941m99mkiw03hrqz-ExtraLarge.jpg" },
            { id: 10, marca: "A. Lange & Söhne", modelo: "Lange 1", precio: 52000, precioTexto: "$52,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhvWf_a4No4qk3iywiuXMyzdcMsnuKMDWVNgqTqfLehUgP0j2gSBal-YgT&s=10" },
            { id: 11, marca: "A. Lange & Söhne", modelo: "Datograph", precio: 98000, precioTexto: "$98,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROIFmu-N6HwGLGfAp0Rw2D1iuv9HBvSgcohynK9OxTl_NWpno_EF-ki88&s=10" },
            { id: 12, marca: "Omega", modelo: "Speedmaster Pro", precio: 7600, precioTexto: "$7,600 USD", imagen: "https://plazavendome.vteximg.com.br/arquivos/ids/167367-1000-1000/Group-29.jpg?v=638725580614030000" },
            { id: 13, marca: "Omega", modelo: "Seamaster Diver 300M", precio: 5900, precioTexto: "$5,900 USD", imagen: "https://plazavendome.vteximg.com.br/arquivos/ids/161251-1000-1000/omega-reloj-seamaster-diver-300m-co-axial-master-chronometer-chronograph-44mm-21030445106001-1.jpg?v=637614546101600000" },
            { id: 14, marca: "Cartier", modelo: "Santos de Cartier", precio: 8200, precioTexto: "$8,200 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTgIp273fN9sle3JaABB3Rnx10OfORxlgIcztHqf8YXAw4h8XIHCYHXO4E&s=10" },
            { id: 15, marca: "Cartier", modelo: "Tank Louis", precio: 13400, precioTexto: "$13,400 USD", imagen: "https://cdn-images.farfetch-contents.com/31/12/21/12/31122112_60347391_600.jpg" },
            { id: 16, marca: "Jaeger-LeCoultre", modelo: "Reverso Tribute", precio: 10800, precioTexto: "$10,800 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7UclMjOUOe9VvAOtseuy0GYuuIWYW6bAYwFmlJZ2wGA&s=10" },
            { id: 17, marca: "Richard Mille", modelo: "RM 11-03", precio: 270000, precioTexto: "$270,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQO_BtwS0xqsJzUoWDXrr4ZGDnTW7mauu3IywFRYqTiZATZOWdWC5fFWmOz&s=10" },
            { id: 18, marca: "TAG Heuer", modelo: "Monaco Calibre 11", precio: 7800, precioTexto: "$7,800 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-BDrzAwddHZeMpRC4vVAoJ1xxEhqncC4OxkqK7BpJmpB4lOBU6P8gCbiC&s=10" },
            { id: 19, marca: "Rolex", modelo: "GMT-Master II Pepsi", precio: 21500, precioTexto: "$21,500 USD", imagen: "https://galileo.tsqsa.com/FTPImagenes/rolex-img/watches-models/m126710blro-0002-drp-upright-bba-with-shadow-landscape.webp" },
            { id: 20, marca: "Rolex", modelo: "Day-Date 40 Oro", precio: 42000, precioTexto: "$42,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRdb8VEnGLpSkCAC5JwwLh6-y_KG0fwBXOs3vpJCzKOUSsA7ZUZFIVyvjHv&s=10" },
            { id: 21, marca: "Olevs", modelo: "el que tiene el profesor", precio: 1000000, precioTexto: "$1,000,000 USD", imagen: "https://http2.mlstatic.com/D_NQ_NP_957121-CBT76357393642_052024-O.webp" },
            { id: 22, marca: "Patek Philippe", modelo: "Aquanaut 5167A", precio: 55000, precioTexto: "$55,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwZnI9O8JLRWIeOZKFYQ3Okq2Y-To0qTbeW6JFYaycUIOZ-oBP0yHhX_q4&s=10" }
        ];

        let currentIndex = 0;
        let cart = [];

        function renderCarousel() {
            const container = document.getElementById('carouselContainer');
            container.innerHTML = '';

            productos.forEach((prod, index) => {
                const card = document.createElement('div');
                card.className = 'card';

                if (index === currentIndex) {
                    card.classList.add('active');
                } else if (index === (currentIndex - 1 + productos.length) % productos.length) {
                    card.classList.add('prev-card');
                } else if (index === (currentIndex + 1) % productos.length) {
                    card.classList.add('next-card');
                }

                card.innerHTML = `
                    <img src="${prod.imagen}" alt="${prod.modelo}">
                    <div class="card-brand">${prod.marca}</div>
                    <div class="card-title">${prod.modelo}</div>
                    <div class="card-price">${prod.precioTexto}</div>
                    <div class="card-buttons">
                        <a href="catalogo.html" class="btn-ver">Ver Más</a>
                        <button class="btn-add" onclick="addToCart(${prod.id}, event)">Añadir</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % productos.length;
            renderCarousel();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + productos.length) % productos.length;
            renderCarousel();
        }

        function triggerMoneyEffect(event) {
            const btn = event.target;
            const rect = btn.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top + rect.height / 2;

            const cartBtn = document.getElementById('cartNavBtn');
            const cartRect = cartBtn.getBoundingClientRect();
            const targetX = cartRect.left + cartRect.width / 2;
            const targetY = cartRect.top + cartRect.height / 2;

            cartBtn.classList.add('bounce');
            setTimeout(() => cartBtn.classList.remove('bounce'), 300);

            for (let i = 0; i < 5; i++) {
                const money = document.createElement('div');
                money.className = 'flying-money';
                money.textContent = '💵';
                
                money.style.left = `${startX}px`;
                money.style.top = `${startY}px`;

                const randX = (Math.random() - 0.5) * 60 + 'px';
                const randRot = (Math.random() - 0.5) * 60 + 'deg';
                const finalX = (targetX - startX) + (Math.random() - 0.5) * 30;
                const finalY = (targetY - startY) + (Math.random() - 0.5) * 30;

                money.style.setProperty('--rand-x', randX);
                money.style.setProperty('--rand-rot', randRot);
                money.style.setProperty('--final-x', `${finalX}px`);
                money.style.setProperty('--final-y', `${finalY}px`);

                document.body.appendChild(money);
                setTimeout(() => money.remove(), 800);
            }
        }

        function addToCart(id, event) {
            triggerMoneyEffect(event);

            const product = productos.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);

            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }

            updateCart();
            setTimeout(() => openCart(), 300);
        }

        function updateQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    const idx = cart.findIndex(i => i.id === id);
                    removeFromCart(idx);
                    return;
                }
            }
            updateCart();
        }

        function removeFromCart(index) {
            const items = document.querySelectorAll('.cart-item');
            const target = items[index];

            if (target) {
                target.classList.add('falling-to-trash');
                setTimeout(() => {
                    cart.splice(index, 1);
                    updateCart();
                }, 400);
            } else {
                cart.splice(index, 1);
                updateCart();
            }
        }

        function updateCart() {
            const container = document.getElementById('cartItemsContainer');
            const countEl = document.getElementById('cartCount');
            const totalEl = document.getElementById('cartTotal');
            const checkoutBtn = document.getElementById('whatsappCheckoutBtn');

            container.innerHTML = '';
            let total = 0;
            let totalItems = 0;

            if (cart.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:30px;">Tu carrito está vacío.</p>';
            } else {
                cart.forEach((item, index) => {
                    total += item.precio * item.qty;
                    totalItems += item.qty;

                    const itemEl = document.createElement('div');
                    itemEl.className = 'cart-item';
                    itemEl.innerHTML = `
                        <img src="${item.imagen}" alt="${item.modelo}">
                        <div class="cart-item-details">
                            <div class="cart-item-title">${item.marca} ${item.modelo}</div>
                            <div class="cart-item-price">$${(item.precio * item.qty).toLocaleString()} USD</div>
                            <div class="cart-item-controls">
                                <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                                <span style="font-size:0.85rem;">${item.qty}</span>
                                <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                                <button class="btn-trash-delete" onclick="removeFromCart(${index})" title="Eliminar producto">
                                    🗑️ <span style="font-size:0.75rem;">Eliminar</span>
                                </button>
                            </div>
                        </div>
                    `;
                    container.appendChild(itemEl);
                });
            }

            countEl.textContent = totalItems;
            totalEl.textContent = `$${total.toLocaleString()} USD`;

            const message = encodeURIComponent(`Hola LUXTIME, deseo realizar el pedido de mi carrito por un total de $${total.toLocaleString()} USD.`);
            checkoutBtn.href = `https://wa.me/573209954324?text=${message}`;
        }

        function openCart() {
            document.getElementById('cartDrawer').classList.add('open');
            document.getElementById('cartOverlay').classList.add('open');
        }

        function closeCart() {
            document.getElementById('cartDrawer').classList.remove('open');
            document.getElementById('cartOverlay').classList.remove('open');
        }

        function applyTheme(theme) {
            const themeIcon = document.getElementById('themeIcon');
            if (theme === 'light') {
                document.body.classList.add('light-mode');
                themeIcon.innerHTML = '☀️ Modo Claro';
            } else {
                document.body.classList.remove('light-mode');
                themeIcon.innerHTML = '🌙 Modo Oscuro';
            }
        }

        function toggleTheme() {
            const currentTheme = document.body.classList.contains('light-mode') ? 'dark' : 'light';
            localStorage.setItem('luxtime_theme', currentTheme);
            applyTheme(currentTheme);
        }

        applyTheme(localStorage.getItem('luxtime_theme') || 'dark');
        renderCarousel();
        updateCart();
    </script>
</body>
</html>
