<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXTIME | Inicio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0b0d; color: #e1e1e6; line-height: 1.6; overflow-x: hidden; }
        
        /* Navegación */
        nav { position: fixed; top: 0; width: 100%; background: rgba(15, 15, 18, 0.95); border-bottom: 1px solid rgba(212, 175, 55, 0.2); z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 18px 50px; }
        .logo { color: #d4af37; font-size: 1.6rem; font-weight: 700; letter-spacing: 3px; text-decoration: none; }
        .nav-links { display: flex; list-style: none; gap: 30px; align-items: center; }
        .nav-links a { color: #c4c4cc; text-decoration: none; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #d4af37; }

        /* Botón de Carrito */
        .cart-btn {
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .cart-btn:hover { background: #d4af37; color: #0b0b0d; }
        .cart-count { background: #d4af37; color: #0b0b0d; border-radius: 50%; padding: 2px 7px; font-size: 0.8rem; }
        .cart-btn:hover .cart-count { background: #0b0b0d; color: #d4af37; }

        /* Sección Hero */
        .hero { padding-top: 110px; min-height: 90vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: radial-gradient(circle, rgba(26,26,32,1) 0%, rgba(11,11,13,1) 100%); padding-bottom: 60px; }
        .hero h1 { font-size: 2.8rem; color: #d4af37; letter-spacing: 6px; margin-bottom: 8px; }
        .hero p { font-size: 1rem; color: #a8a8b3; max-width: 600px; margin-bottom: 40px; }

        /* Escenario del Carrusel 3D */
        .carousel-3d-stage {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 430px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* Tarjetas de Producto */
        .card-3d {
            position: absolute;
            width: 300px;
            height: 400px;
            background: #141418;
            border: 1px solid #2a2a30;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .card-3d img { width: 100%; height: 210px; object-fit: cover; background-color: #1a1a20; }
        .card-3d-body { padding: 18px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; text-align: left; }
        .card-marca { color: #d4af37; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
        .card-modelo { font-size: 1.1rem; color: #fff; margin: 3px 0; font-weight: 600; }
        .card-precio { font-size: 1rem; color: #d4af37; font-weight: 700; margin-bottom: 10px; }

        .card-buttons { display: flex; gap: 8px; }
        .btn-card {
            flex: 1;
            text-align: center;
            padding: 8px;
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.75rem;
            border-radius: 4px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .btn-card:hover { background: #d4af37; color: #0b0b0d; }
        .btn-add-cart { background: #d4af37; color: #0b0b0d; }
        .btn-add-cart:hover { background: #f0c442; }

        /* Posiciones del Carrusel */
        .card-3d.active { transform: translateX(0) scale(1.05); z-index: 3; opacity: 1; border-color: #d4af37; pointer-events: auto; }
        .card-3d.prev { transform: translateX(-240px) scale(0.82); z-index: 2; opacity: 0.55; filter: brightness(0.7); }
        .card-3d.next { transform: translateX(240px) scale(0.82); z-index: 2; opacity: 0.55; filter: brightness(0.7); }

        /* Panel Lateral del Carrito */
        .cart-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; display: none; }
        .cart-drawer { position: fixed; top: 0; right: -420px; width: 100%; max-width: 400px; height: 100%; background: #141418; border-left: 1px solid #2a2a30; z-index: 2001; transition: right 0.4s ease; display: flex; flex-direction: column; padding: 25px; }
        .cart-drawer.open { right: 0; }
        .cart-overlay.open { display: block; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a30; padding-bottom: 15px; }
        .cart-header h2 { color: #d4af37; font-size: 1.3rem; }
        .close-cart { background: none; border: none; color: #a8a8b3; font-size: 1.5rem; cursor: pointer; }
        .cart-items { flex-grow: 1; overflow-y: auto; margin: 20px 0; display: flex; flex-direction: column; gap: 15px; }
        .cart-item { display: flex; gap: 15px; background: #1a1a20; padding: 10px; border-radius: 6px; border: 1px solid #2a2a30; align-items: center; }
        .cart-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
        .cart-item-details { flex-grow: 1; }
        .cart-item-title { font-size: 0.9rem; color: #fff; font-weight: 600; }
        .cart-item-price { font-size: 0.85rem; color: #d4af37; font-weight: 700; }
        .cart-item-qty { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
        .qty-btn { background: #2a2a30; color: #fff; border: none; width: 22px; height: 22px; border-radius: 3px; cursor: pointer; font-weight: 700; }
        .qty-btn:hover { background: #d4af37; color: #0b0b0d; }
        .remove-item { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 0.8rem; margin-left: 10px; }
        .cart-footer { border-top: 1px solid #2a2a30; padding-top: 15px; }
        .cart-total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 20px; }
        .cart-total span:last-child { color: #d4af37; }
        .btn-checkout { display: block; width: 100%; text-align: center; background: #25d366; color: #fff; padding: 12px; border-radius: 4px; text-decoration: none; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        footer { text-align: center; padding: 30px; border-top: 1px solid #23232a; color: #737380; margin-top: 20px; }

        @media (max-width: 768px) {
            .card-3d.prev { transform: translateX(-140px) scale(0.75); }
            .card-3d.next { transform: translateX(140px) scale(0.75); }
            .card-3d { width: 250px; height: 380px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">LUXTIME</a>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Inicio</a></li>
            <li><a href="historia.html">Nuestra Historia</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="contacto.html">Contáctenos</a></li>
            <li>
                <button class="cart-btn" onclick="toggleCart()">
                    🛒 Carrito <span class="cart-count" id="cartCount">0</span>
                </button>
            </li>
        </ul>
    </nav>

    <div class="hero">
        <h1>LUXTIME</h1>
        <p>Alta Relojería de Lujo desde San Gil, Santander.</p>
        <div class="carousel-3d-stage" id="carouselStage"></div>
    </div>

    <!-- Carrito Lateral -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h2>Tu Carrito de Compras</h2>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total Estimado:</span>
                <span id="cartTotal">$0 USD</span>
            </div>
            <a href="#" class="btn-checkout" id="checkoutBtn" target="_blank">Pedir por WhatsApp</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 LUXTIME. San Gil, Santander.</p>
    </footer>

    <script>
        const productos = [
            { id: 1, marca: "Rolex", modelo: "Submariner Date", precio: 14500, precioTexto: "$14,500 USD", imagen: "https://media.rolex.com/image/upload/q_auto/f_auto/t_v7-cover-majesty-landscape/c_limit,w_800/v1/a677b2c664f6/catalogue/2026/upright-c/m126610ln-0001" },
            { id: 2, marca: "Rolex", modelo: "Cosmograph Daytona", precio: 38000, precioTexto: "$38,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlMAYEo_kmq0SEVRRTfxLseV2wnsMXngC2wunQaGWdsA&s=10" },
            { id: 3, marca: "Rolex", modelo: "Datejust 41", precio: 12800, precioTexto: "$12,800 USD", imagen: "https://encrypted-tbn1.gstatic.com/shopping?q=tbn:ANd9GcTCPIgqQ33orNUNhxU0779oylJW_-m0yjFpjWaGA-b_bzN0TGecWLGU8Okqk5lRgcdJKpuhqx5KMnpC9GricJ_KrD7a5emn" },
            { id: 4, marca: "Patek Philippe", modelo: "Nautilus 5711/1A", precio: 115000, precioTexto: "$115,000 USD", imagen: "https://www.officialwatches.com/cdn/shop/products/502410_600x.jpg?v=1610711759" },
            { id: 5, marca: "Patek Philippe", modelo: "Calatrava Automatic", precio: 29500, precioTexto: "$29,500 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTM6yhdJw0yoWIQaHOMv5jZjZLXv9AW1ZJd6AOJXYUJHaDeSEHnXEEJecQ&s=10" },
            { id: 6, marca: "Audemars Piguet", modelo: "Royal Oak", precio: 62000, precioTexto: "$62,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSIbNA3xzhtwSOrqsB6eXBQMebC6EbjvqxL0OhHR9MaDw&s=10" },
            { id: 7, marca: "Audemars Piguet", modelo: "Royal Oak Offshore", precio: 45000, precioTexto: "$45,000 USD", imagen: "https://i.ebayimg.com/images/g/Dp0AAeSwsehqYDNt/s-l1200.webp" },
            { id: 8, marca: "Vacheron Constantin", modelo: "Overseas", precio: 36000, precioTexto: "$36,000 USD", imagen: "https://cdn-images.farfetch-contents.com/31/12/19/48/31121948_60422243_1000.jpg" },
            { id: 9, marca: "Vacheron Constantin", modelo: "Historiques 1921", precio: 41000, precioTexto: "$41,000 USD", imagen: "https://img.chrono24.com/images/uhren/47100979-38kqklhc941m99mkiw03hrqz-ExtraLarge.jpg" },
            { id: 10, marca: "A. Lange & Söhne", modelo: "Lange 1", precio: 52000, precioTexto: "$52,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhvWf_a4No4qk3iywiuXMyzdcMsnuKMDWVNgqTqfLehUgP0j2gSBal-YgT&s=10" },
            { id: 11, marca: "A. Lange & Söhne", modelo: "Datograph", precio: 98000, precioTexto: "$98,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROIFmu-N6HwGLGfAp0Rw2D1iuv9HBvSgcohynK9OxTl_NWpno_EF-ki88&s=10" },
            { id: 12, marca: "Omega", modelo: "Speedmaster Pro", precio: 7600, precioTexto: "$7,600 USD", imagen: "https://plazavendome.vteximg.com.br/arquivos/ids/167367-1000-1000/Group-29.jpg?v=638725580614030000" },
            { id: 13, marca: "Omega", modelo: "Seamaster Diver 300M", precio: 5900, precioTexto: "$5,900 USD", imagen: "https://plazavendome.vteximg.com.br/arquivos/ids/161251-1000-1000/omega-reloj-seamaster-diver-300m-co-axial-master-chronometer-chronograph-44mm-21030445106001-1.jpg?v=637614546101600000" },
            { id: 14, marca: "Cartier", modelo: "Santos de Cartier", precio: 8200, precioTexto: "$8,200 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTgIp273fN9sle3JaABB3Rnx10OfORxlgIcztHqf8YXAw4h8XIHCYHXO4E&s=10" },
            { id: 15, marca: "Cartier", modelo: "Tank Louis", precio: 13400, precioTexto: "$13,400 USD", imagen: "https://cdn-images.farfetch-contents.com/31/12/21/12/31122112_60347391_600.jpg" },
            { id: 16, marca: "Jaeger-LeCoultre", modelo: "Reverso Tribute", precio: 10800, precioTexto: "$10,800 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7UclMjOUOe9VvAOtseuy0GYuuIWYW6bAYwFmlJZ2wGA&s=10" },
            { id: 17, marca: "Richard Mille", modelo: "RM 11-03", precio: 270000, precioTexto: "$270,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQO_BtwS0xqsJzUoWDXrr4ZGDnTW7mauu3IywFRYqTiZATZOWdWC5fFWmOz&s=10" },
            { id: 18, marca: "TAG Heuer", modelo: "Monaco Calibre 11", precio: 7800, precioTexto: "$7,800 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-BDrzAwddHZeMpRC4vVAoJ1xxEhqncC4OxkqK7BpJmpB4lOBU6P8gCbiC&s=10" },
            { id: 19, marca: "Rolex", modelo: "GMT-Master II Pepsi", precio: 21500, precioTexto: "$21,500 USD", imagen: "https://galileo.tsqsa.com/FTPImagenes/rolex-img/watches-models/m126710blro-0002-drp-upright-bba-with-shadow-landscape.webp" },
            { id: 20, marca: "Rolex", modelo: "Day-Date 40 Oro", precio: 42000, precioTexto: "$42,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRdb8VEnGLpSkCAC5JwwLh6-y_KG0fwBXOs3vpJCzKOUSsA7ZUZFIVyvjHv&s=10" },
            { id: 21, marca: "Olevs", modelo: "el que tiene el profesor", precio: 1000000, precioTexto: "$1,000,000 USD", imagen: "https://http2.mlstatic.com/D_NQ_NP_957121-CBT76357393642_052024-O.webp" },
            { id: 22, marca: "Patek Philippe", modelo: "Aquanaut 5167A", precio: 55000, precioTexto: "$55,000 USD", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwZnI9O8JLRWIeOZKFYQ3Okq2Y-To0qTbeW6JFYaycUIOZ-oBP0yHhX_q4&s=10" }
        ];

        // --- CARRUSEL 3D ---
        const stage = document.getElementById('carouselStage');

        productos.forEach((p) => {
            const card = document.createElement('div');
            card.className = 'card-3d';
            card.innerHTML = `
                <img src="${p.imagen}" alt="${p.marca} ${p.modelo}">
                <div class="card-3d-body">
                    <div>
                        <span class="card-marca">${p.marca}</span>
                        <h3 class="card-modelo">${p.modelo}</h3>
                        <div class="card-precio">${p.precioTexto}</div>
                    </div>
                    <div class="card-buttons">
                        <a href="producto.html?id=${p.id}" class="btn-card">Ver</a>
                        <button class="btn-card btn-add-cart" onclick="addToCart(${p.id})">+ Carrito</button>
                    </div>
                </div>
            `;
            stage.appendChild(card);
        });

        const cards = document.querySelectorAll('.card-3d');
        let currentIndex = 0;

        function actualizarPosiciones() {
            const total = cards.length;
            cards.forEach((card, i) => {
                card.classList.remove('active', 'prev', 'next');
                const prevIndex = (currentIndex - 1 + total) % total;
                const nextIndex = (currentIndex + 1) % total;

                if (i === currentIndex) card.classList.add('active');
                else if (i === prevIndex) card.classList.add('prev');
                else if (i === nextIndex) card.classList.add('next');
            });
            currentIndex = (currentIndex + 1) % total;
        }

        actualizarPosiciones();
        setInterval(actualizarPosiciones, 3000);

        // --- SISTEMA DE CARRITO ---
        let cart = JSON.parse(localStorage.getItem('luxtime_cart')) || [];

        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('open');
            document.getElementById('cartOverlay').classList.toggle('open');
        }

        function addToCart(id) {
            const p = productos.find(item => item.id === id);
            const itemInCart = cart.find(item => item.id === id);

            if (itemInCart) {
                itemInCart.cantidad++;
            } else {
                cart.push({ ...p, cantidad: 1 });
            }

            saveAndUpdateCart();
            toggleCart();
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.cantidad += delta;
                if (item.cantidad <= 0) cart = cart.filter(i => i.id !== id);
            }
            saveAndUpdateCart();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            saveAndUpdateCart();
        }

        function saveAndUpdateCart() {
            localStorage.setItem('luxtime_cart', JSON.stringify(cart));
            renderCart();
        }

        function renderCart() {
            const cartItemsContainer = document.getElementById('cartItems');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');
            const checkoutBtn = document.getElementById('checkoutBtn');

            cartItemsContainer.innerHTML = '';
            let total = 0;
            let totalCount = 0;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: #a8a8b3; text-align: center; margin-top: 30px;">Tu carrito está vacío.</p>';
            } else {
                cart.forEach(item => {
                    total += item.precio * item.cantidad;
                    totalCount += item.cantidad;

                    const itemElement = document.createElement('div');
                    itemElement.className = 'cart-item';
                    itemElement.innerHTML = `
                        <img src="${item.imagen}" alt="${item.modelo}">
                        <div class="cart-item-details">
                            <div class="cart-item-title">${item.marca} ${item.modelo}</div>
                            <div class="cart-item-price">$${(item.precio * item.cantidad).toLocaleString()} USD</div>
                            <div class="cart-item-qty">
                                <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                                <span>${item.cantidad}</span>
                                <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                                <button class="remove-item" onclick="removeFromCart(${item.id})">Eliminar</button>
                            </div>
                        </div>
                    `;
                    cartItemsContainer.appendChild(itemElement);
                });
            }

            cartCount.textContent = totalCount;
            cartTotal.textContent = `$${total.toLocaleString()} USD`;

            if (cart.length > 0) {
                let mensaje = "Hola LUXTIME, deseo realizar el pedido de los siguientes relojes:%0A%0A";
                cart.forEach(item => {
                    mensaje += `• ${item.marca} ${item.modelo} x${item.cantidad} - $${(item.precio * item.cantidad).toLocaleString()} USD%0A`;
                });
                mensaje += `%0ATotal: $${total.toLocaleString()} USD`;
                checkoutBtn.href = `https://wa.me/573209954324?text=${mensaje}`;
            } else {
                checkoutBtn.href = "#";
            }
        }

        renderCart();
    </script>
</body>
</html>
